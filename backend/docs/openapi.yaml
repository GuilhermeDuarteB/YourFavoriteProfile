openapi: 3.0.3

info:
  title: Your Favorite Profile API
  version: 1.0.0
  description: >
    REST API for Your Favorite Profile, supporting authentication,
    media discovery, reviews, public profiles, follows, watchlists
    and Top 5 media. Explicit slurs covered by the server moderation policy are
    rejected in usernames, bios and review comments. Matching media titles are
    omitted from discovery and stored media lists without deleting records;
    blocked direct media/episode requests return a generic 404. Legacy blocked
    bios and review comments are hidden in public responses.

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Auth
  - name: Users
  - name: Media
  - name: Reviews
  - name: Follow
  - name: Watchlist
  - name: Top Five

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 3

        username:
          type: string
          example: guilherme

        email:
          type: string
          format: email
          example: guilherme@example.com

        bio:
          type: string
          nullable: true

        avatar_url:
          type: string
          nullable: true

        created_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"

        token:
          type: string
          description: JWT access token.

    PublicFollowUser:
      type: object
      additionalProperties: false
      required: [id, username, avatarUrl]
      properties:
        id:
          type: integer
        username:
          type: string
          description: Current stored display casing.
        avatarUrl:
          type: string
          nullable: true

    FollowPage:
      type: object
      required: [username, users, page, pageSize, total, totalPages]
      properties:
        username:
          type: string
          description: Canonical username of the profile being viewed.
        users:
          type: array
          items:
            $ref: "#/components/schemas/PublicFollowUser"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    MediaCard:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          example: 550

        source:
          type: string
          enum:
            - tmdb
            - rawg
          example: tmdb

        title:
          type: string
          example: Fight Club

        type:
          type: string
          enum:
            - movie
            - series
            - game
          example: movie

        releaseDate:
          type: string
          nullable: true
          example: "1999-10-15"

        meta:
          type: string
          nullable: true
          example: "1999"

        score:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 10
          example: 8.4

        posterUrl:
          type: string
          nullable: true
          example: https://image.tmdb.org/t/p/w500/example.jpg

        developer:
          type: string
          nullable: true
          description: Present mainly for game results.
          example: Rockstar Games

    LatestEpisode:
      type: object
      properties:
        code:
          type: string
          example: S02E08

        title:
          type: string
          example: Episode Title

        show:
          type: string
          example: Example Series

        airDate:
          type: string
          nullable: true
          example: "2026-10-01"

        posterUrl:
          type: string
          nullable: true

    RecentReview:
      type: object
      description: A direct movie/game review or an episode review with its parent series metadata.
      properties:
        id:
          type: integer
        score:
          oneOf:
            - type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 10
            - type: string
          description: Scores are greater than 0 and at most 10. PostgreSQL numeric scores may be serialized as strings.
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        title:
          type: string
          description: Media title, or parent series title for an episode review.
        poster_url:
          type: string
          nullable: true
        type:
          type: string
          enum: [movie, game, series]
        episode_id:
          type: integer
          nullable: true
        episode_title:
          type: string
          nullable: true
        season_number:
          type: integer
          nullable: true
        episode_number:
          type: integer
          nullable: true

    UserReview:
      type: object
      properties:
        id:
          type: integer
        score:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 10
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        mediaId:
          type: integer
          description: Internal parent media ID, including the series for an episode review.
        externalId:
          type: string
        mediaType:
          type: string
          enum: [movie, series, game]
        mediaTitle:
          type: string
        posterUrl:
          type: string
          nullable: true
        genres:
          type: array
          items:
            type: string
        episodeId:
          type: integer
          nullable: true
        episodeTitle:
          type: string
          nullable: true
        episodeNumber:
          type: integer
          nullable: true
        seasonNumber:
          type: integer
          nullable: true

    UserReviewsPage:
      type: object
      properties:
        username:
          type: string
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/UserReview"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          description: Review count after filters.
        totalPages:
          type: integer
          description: Zero when no reviews match. An out-of-range page returns an empty reviews array.
        totalUserReviews:
          type: integer
          description: Unfiltered count, used to distinguish an empty profile from empty filter results.
        availableGenres:
          type: array
          description: Sorted unique parent-media genres across all this user's reviews, independent of filters.
          items:
            type: string

    CastMember:
      type: object
      properties:
        name:
          type: string
          example: Example Actor

        character:
          type: string
          example: Example Character

        photoUrl:
          type: string
          nullable: true

    Season:
      type: object
      properties:
        seasonNumber:
          type: integer
          example: 1

        name:
          type: string
          example: Season 1

        episodeCount:
          type: integer
          example: 10

    MediaDetails:
      type: object
      properties:
        externalId:
          type: string
          example: "550"

        mediaId:
          type: integer
          description: Internal database media ID.
          example: 42

        source:
          type: string
          enum:
            - tmdb
            - rawg

        type:
          type: string
          enum:
            - movie
            - series
            - game

        title:
          type: string
          example: Fight Club

        overview:
          type: string
          nullable: true

        posterUrl:
          type: string
          nullable: true

        releaseDate:
          type: string
          nullable: true

        score:
          type: number
          description: External provider score from TMDB, or RAWG normalized to the 0–10 scale. Not the community score.
          format: float
          nullable: true
          minimum: 0
          maximum: 10

        communityScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 10
          description: Your Favorite Profile score. Movies/games average direct reviews; series average rated episode averages. Null when there are no ratings.

        genres:
          type: array
          items:
            type: string

        cast:
          type: array
          description: Present for movies and TV series.
          items:
            $ref: "#/components/schemas/CastMember"

        seasons:
          type: array
          description: Present for TV series.
          items:
            $ref: "#/components/schemas/Season"

        developer:
          type: string
          nullable: true
          description: Present for games.

        platforms:
          type: array
          description: Present for games.
          items:
            type: string

    Episode:
      type: object
      properties:
        episodeId:
          type: integer
          description: Internal database episode ID used when submitting reviews.
        episodeNumber:
          type: integer
        title:
          type: string
        overview:
          type: string
        airDate:
          type: string
          nullable: true
          format: date
        stillUrl:
          type: string
          nullable: true

    SeasonEpisodes:
      type: object
      properties:
        seasonNumber:
          type: integer
          minimum: 1
        name:
          type: string
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/Episode"

    Review:
      type: object
      properties:
        id:
          type: integer
          example: 15

        user_id:
          type: integer
          example: 3

        media_id:
          type: integer
          nullable: true
          example: 42

        episode_id:
          type: integer
          nullable: true
          example: 120

        score:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          maximum: 10
          example: 8.5

        comment:
          type: string
          nullable: true
          example: Really enjoyed this one.

        username:
          type: string
          description: Included when reviews are loaded for media or episodes.
          example: guilherme

        avatar_url:
          type: string
          nullable: true
          description: Included when reviews are loaded for media or episodes.

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

    WatchlistEntry:
      type: object
      properties:
        user_id:
          type: integer
          example: 3

        media_id:
          type: integer
          example: 42

        status:
          type: string
          enum:
            - want_to_watch
            - watching
            - completed
            - dropped
          example: watching

        external_id:
          type: string
          nullable: true
          example: "550"

        title:
          type: string
          nullable: true
          example: Fight Club

        poster_url:
          type: string
          nullable: true

        type:
          type: string
          nullable: true
          enum:
            - movie
            - series
            - game

        release_date:
          type: string
          nullable: true
          example: "1999-10-15"

        added_at:
          type: string
          format: date-time

    TopFiveInput:
      type: object
      required:
        - mediaId
        - rank
      properties:
        mediaId:
          type: integer
          minimum: 1
          example: 42

        rank:
          type: integer
          minimum: 1
          maximum: 5
          example: 1

    TopFiveEntry:
      type: object
      additionalProperties: true
      properties:
        rank:
          type: integer
          minimum: 1
          maximum: 5
          example: 1

        media_id:
          type: integer
          example: 42

        external_id:
          type: string
          nullable: true
          example: "550"

        title:
          type: string
          nullable: true
          example: Fight Club

        poster_url:
          type: string
          nullable: true

        type:
          type: string
          nullable: true
          enum:
            - movie
            - series
            - game

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Creates a new account and returns the authenticated user/session data. Usernames are unique case-insensitively and retain their submitted display casing. Usernames containing an explicit slur covered by the server moderation policy are rejected with 400 without echoing the input.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_.]+$'
                  example: guilherme

                email:
                  type: string
                  format: email
                  example: guilherme@example.com

                password:
                  type: string
                  format: password
                  minLength: 8
                  example: password123

      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

        "400":
          description: Invalid registration data

        "409":
          description: Username (ignoring case) or email already exists, including concurrent registration conflicts

        "500":
          description: Internal server error

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      description: Authenticates a user using email and password.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: guilherme@example.com

                password:
                  type: string
                  format: password
                  example: password123

      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

        "400":
          description: Missing or invalid credentials

        "401":
          description: Invalid email or password

        "500":
          description: Internal server error

  /api/auth/me/email:
    put:
      tags:
        - Auth
      summary: Update account email
      description: Updates the authenticated user's email address after password confirmation.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newEmail
                - password
              properties:
                newEmail:
                  type: string
                  format: email
                  example: newemail@example.com

                password:
                  type: string
                  format: password
                  example: password123

      responses:
        "200":
          description: Email updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          description: Invalid email or request data

        "401":
          description: Authentication required or incorrect password

        "409":
          description: Email already in use

        "500":
          description: Internal server error

  /api/auth/me/username:
    put:
      tags:
        - Auth
      summary: Update account username
      description: Updates the authenticated user's username after password confirmation. Case-only changes by the same user are allowed; names owned by another user are rejected ignoring case. Display casing is preserved and ID-based relationships remain unchanged. Old names do not become aliases. The same server-side moderation policy as registration applies.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newUsername
                - password
              properties:
                newUsername:
                  type: string
                  minLength: 3
                  maxLength: 50
                  pattern: '^[a-zA-Z0-9_.]+$'
                  example: new_username

                password:
                  type: string
                  format: password
                  example: password123

      responses:
        "200":
          description: Username updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "400":
          description: Invalid username or request data

        "401":
          description: Authentication required or incorrect password

        "409":
          description: Username already in use by another account, ignoring case (including concurrent conflicts)

        "500":
          description: Internal server error

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the current account
      description: Resolves the JWT user ID to the current username and private editable profile. Allows persisted sessions to refresh after an administrator renames an account. Returns only the authenticated account; never returns password hashes. A legacy bio is available here for its owner to edit even when hidden from public profiles.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid token or account no longer exists (INVALID_TOKEN)
        "500":
          description: Error loading current account
    delete:
      tags:
        - Auth
      summary: Delete account
      description: Permanently deletes the authenticated user's account after password confirmation.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  example: password123

      responses:
        "204":
          description: Account deleted successfully

        "400":
          description: Password is required

        "401":
          description: Authentication required or incorrect password

        "500":
          description: Internal server error

  /api/users/search:
    get:
      tags:
        - Users
      summary: Search users
      description: Searches users by username case-insensitively and returns stored display casing.

      parameters:
        - in: query
          name: q
          required: false
          description: Username search term.
          schema:
            type: string
          example: gui

      responses:
        "200":
          description: User search results
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true

        "500":
          description: Error searching users

  /api/users/{username}/reviews:
    get:
      tags: [Users]
      summary: Get a user's public review history
      description: Paginated movie/game reviews and episode reviews resolved through their parent series. Username lookup is case-insensitive and the response returns stored display casing. Legacy direct series reviews remain readable. No authentication required.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
            enum: [movie, series, game]
        - in: query
          name: genre
          description: Exact parent-media genre from availableGenres, with surrounding whitespace trimmed.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - in: query
          name: minScore
          description: Minimum 0–10 score. Star filters map 5 stars to 10, 4+ to 8, 3+ to 6, 2+ to 4, and 1+ to 2.
          schema:
            type: number
            minimum: 0
            maximum: 10
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, oldest, highest, lowest]
            default: newest
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Filtered reviews and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserReviewsPage"
        "400":
          description: Invalid filters, sort, or pagination
        "404":
          description: User not found
        "500":
          description: Error loading user reviews

  /api/users/{username}/followers:
    get:
      tags: [Users]
      summary: List a profile's followers
      description: Public, case-insensitive username lookup. Lists safe public account fields ordered by lowercase username then ID; includes no emails or private profile fields. Pages beyond the end return an empty users array.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Followers and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowPage"
        "400":
          description: Invalid pagination parameters
        "404":
          description: User not found
        "500":
          description: Error loading followers

  /api/users/{username}/following:
    get:
      tags: [Users]
      summary: List the accounts a profile follows
      description: Public, case-insensitive username lookup. Lists safe public account fields ordered by lowercase username then ID; includes no emails or private profile fields. Pages beyond the end return an empty users array.
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Followed accounts and pagination metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowPage"
        "400":
          description: Invalid pagination parameters
        "404":
          description: User not found
        "500":
          description: Error loading following accounts

  /api/users/{username}:
    get:
      tags:
        - Users
      summary: Get public user profile
      description: >
        Returns a public profile including stats, recent reviews,
        genre breakdown, follow information and Top 5 media.
        Authentication is optional and is used to determine whether
        the current viewer follows the profile.
        Username lookup is case-insensitive. The response includes the stable
        user ID and stored display casing; URL casing does not change ownership.
        Bios blocked by the moderation policy are returned as null. Stored media
        with blocked titles are omitted from recent reviews and Top 5 without deleting records.

      security:
        - {}
        - bearerAuth: []

      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          example: guilherme

      responses:
        "200":
          description: Public profile loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Stable user ID for ownership comparisons.
                  username:
                    type: string
                    example: guilherme

                  bio:
                    type: string
                    nullable: true

                  avatarUrl:
                    type: string
                    nullable: true

                  createdAt:
                    type: string
                    format: date-time

                  stats:
                    type: object
                    additionalProperties: true

                  recentReviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecentReview"

                  genreBreakdown:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

                  followCounts:
                    type: object
                    additionalProperties: true

                  viewerFollows:
                    type: boolean

                  topFive:
                    type: array
                    items:
                      $ref: "#/components/schemas/TopFiveEntry"

        "404":
          description: User not found

        "500":
          description: Error loading profile

  /api/users/me:
    put:
      tags:
        - Users
      summary: Update current user's public profile
      description: Updates supplied bio/avatar fields only; omitted fields retain their stored values. Bio accepts text up to 280 UTF-16 code units or null. Empty string/null clears it. Explicit slurs covered by the centralized moderation policy are rejected. Existing stored bios are never automatically shortened or overwritten.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                  nullable: true
                  maxLength: 280
                  example: Software developer and movie fan.

                avatarUrl:
                  type: string
                  nullable: true
                  example: https://example.com/avatar.jpg

      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

        "400":
          description: Invalid body or bio/avatar types, excessive bio length, or disallowed content

        "401":
          description: Authentication required or invalid token

        "500":
          description: Error updating profile

  /api/media/trending:
    get:
      tags:
        - Media
      summary: Get trending media
      description: >
        Returns a mixed list of trending movies, TV series and games.
        TMDB and RAWG are queried independently, so partial results may still
        be returned if one provider fails.

      responses:
        "200":
          description: Trending media loaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaCard"

        "502":
          description: All trending providers are unavailable

        "500":
          description: Error loading trending media

  /api/media/latest-episodes:
    get:
      tags:
        - Media
      summary: Get latest TV episodes
      description: Returns the latest aired episode information from trending TV series.

      responses:
        "200":
          description: Latest episodes loaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LatestEpisode"

        "500":
          description: Error loading latest episodes

  /api/media/discover:
    get:
      tags:
        - Media
      summary: Discover or search media
      description: >
        Discovers or searches movies, TV series and games using TMDB and RAWG.
        Genre filters are provider-aware, and unsupported media types are
        excluded rather than receiving invalid genre parameters.

      parameters:
        - in: query
          name: types
          required: false
          description: Comma-separated media types.
          schema:
            type: string
            default: movie,series,game
          example: movie,series,game

        - in: query
          name: genre
          required: false
          description: Genre key. Use all for no genre filter.
          schema:
            type: string
            default: all
          example: drama

        - in: query
          name: decade
          required: false
          description: Starting year of the decade, or all.
          schema:
            type: string
            default: all
          example: "2010"

        - in: query
          name: minRating
          required: false
          description: Minimum normalized rating from 0 to 10.
          schema:
            type: number
            minimum: 0
            maximum: 10
            default: 0
          example: 7

        - in: query
          name: sortBy
          required: false
          description: Result sorting mode.
          schema:
            type: string
            enum:
              - popularity
              - rating
              - release_date
              - title
            default: popularity

        - in: query
          name: page
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1

        - in: query
          name: query
          required: false
          description: Optional text search query.
          schema:
            type: string
          example: batman

      responses:
        "200":
          description: Discover/search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                    example: 1

                  pageSize:
                    type: integer
                    example: 50

                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaCard"

                  hasMore:
                    type: boolean
                    example: true

                  warnings:
                    type: array
                    items:
                      type: string

        "400":
          description: Genre is not supported for the selected media types

        "502":
          description: All selected media providers are unavailable

        "500":
          description: Error loading discover results

  /api/media/series/{id}/season/{seasonNumber}:
    get:
      tags:
        - Media
      summary: Load season episodes for a series
      description: Fetches TMDB metadata and resolves local series, season, and episode identities. Use the returned internal episodeId for episode reviews. This endpoint is public.
      parameters:
        - in: path
          name: id
          required: true
          description: External TMDB series ID.
          schema:
            type: integer
            minimum: 1
        - in: path
          name: seasonNumber
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Season episodes loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonEpisodes"
        "400":
          description: Series ID or season number is not a positive integer
        "404":
          description: Series or season is unavailable under the title moderation policy
        "500":
          description: Provider or database failure loading season episodes

  /api/media/{type}/{id}:
    get:
      tags:
        - Media
      summary: Get media details
      description: >
        Loads full details from TMDB or RAWG and ensures the media exists
        in the local database before returning the response.

      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum:
              - movie
              - series
              - game
          example: movie

        - in: path
          name: id
          required: true
          description: External TMDB or RAWG media ID.
          schema:
            type: string
          example: "550"

      responses:
        "200":
          description: Media details loaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaDetails"

        "400":
          description: Invalid media type

        "404":
          description: Media unavailable under the title moderation policy

        "500":
          description: Error loading media details

  /api/reviews:
    post:
      tags:
        - Reviews
      summary: Create a review
      description: >
        Creates a direct review for a movie/game or a review for an episode.
        Series must be reviewed by episode; a series mediaId is rejected with 400.
        Exactly one of mediaId or episodeId must be provided.
        A user may only have one review for the same media or episode.
        Comments are subject to the same explicit-slur moderation policy as bios.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              oneOf:
                - required: [mediaId]
                - required: [episodeId]
              properties:
                mediaId:
                  type: integer
                  minimum: 1
                  description: Internal movie/game ID. Series IDs are not accepted.
                  example: 42

                episodeId:
                  type: integer
                  minimum: 1
                  description: Internal episode ID returned by the season endpoint.
                  example: 120

                score:
                  type: number
                  format: float
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 10
                  example: 8.5

                comment:
                  type: string
                  nullable: true
                  example: Really enjoyed this one.

      responses:
        "201":
          description: Review created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

        "400":
          description: Invalid review data, invalid target IDs, or a direct series review attempt

        "401":
          description: Authentication required or invalid token

        "409":
          description: User already reviewed this media or episode

        "404":
          description: Media or episode not found

        "500":
          description: Error creating review

  /api/reviews/media/{mediaId}:
    get:
      tags:
        - Reviews
      summary: Get reviews for a media item
      description: Returns reviews for available media. Legacy comments matching the moderation policy are returned as null without changing stored reviews.

      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
          example: 42

      responses:
        "200":
          description: Media reviews loaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

        "404":
          description: Media not found or unavailable

        "500":
          description: Error loading reviews

  /api/reviews/episode/{episodeId}:
    get:
      tags:
        - Reviews
      summary: Get reviews for an episode
      description: Returns reviews for an available TV episode. Legacy comments matching the moderation policy are returned as null without changing stored reviews.

      parameters:
        - in: path
          name: episodeId
          required: true
          schema:
            type: integer
          example: 120

      responses:
        "200":
          description: Episode reviews loaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

        "404":
          description: Episode not found or unavailable

        "500":
          description: Error loading reviews

  /api/reviews/{id}:
    put:
      tags:
        - Reviews
      summary: Update a review
      description: >
        Updates an existing review.
        Only the user who created the review is allowed to edit it.

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 15

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - score
              properties:
                score:
                  type: number
                  format: float
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 10
                  example: 9

                comment:
                  type: string
                  nullable: true
                  example: Changed my mind after a rewatch.

      responses:
        "200":
          description: Review updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

        "400":
          description: Invalid review data

        "401":
          description: Authentication required or invalid token

        "403":
          description: User can only edit their own reviews

        "404":
          description: Review not found

        "500":
          description: Error updating review

    delete:
      tags:
        - Reviews
      summary: Delete a review
      description: >
        Deletes an existing review.
        Only the user who created the review is allowed to delete it.

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 15

      responses:
        "204":
          description: Review deleted successfully

        "401":
          description: Authentication required or invalid token

        "403":
          description: User can only delete their own reviews

        "404":
          description: Review not found

        "500":
          description: Error deleting review

  /api/watchlist:
    post:
      tags:
        - Watchlist
      summary: Add media to watchlist
      description: >
        Adds a media item to the authenticated user's watchlist.
        If status is omitted, it defaults to want_to_watch.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaId
              properties:
                mediaId:
                  type: integer
                  example: 42

                status:
                  type: string
                  enum:
                    - want_to_watch
                    - watching
                    - completed
                    - dropped
                  default: want_to_watch
                  example: watching

      responses:
        "201":
          description: Media added to watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntry"

        "400":
          description: Invalid mediaId or watchlist status

        "401":
          description: Authentication required or invalid token

        "404":
          description: Media not found or unavailable

        "500":
          description: Error adding to watchlist

  /api/watchlist/me:
    get:
      tags:
        - Watchlist
      summary: Get current user's watchlist
      description: >
        Returns the authenticated user's watchlist.
        Results may optionally be filtered by status.

      security:
        - bearerAuth: []

      parameters:
        - in: query
          name: status
          required: false
          description: Optional watchlist status filter.
          schema:
            type: string
            enum:
              - want_to_watch
              - watching
              - completed
              - dropped

      responses:
        "200":
          description: Watchlist loaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistEntry"

        "400":
          description: Invalid watchlist status

        "401":
          description: Authentication required or invalid token

        "500":
          description: Error loading watchlist

  /api/watchlist/{mediaId}:
    get:
      tags:
        - Watchlist
      summary: Get watchlist status for a media item
      description: Checks whether a media item is present in the authenticated user's watchlist.

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
          example: 42

      responses:
        "200":
          description: Watchlist status returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  inWatchlist:
                    type: boolean
                    example: true

                  status:
                    type: string
                    nullable: true
                    enum:
                      - want_to_watch
                      - watching
                      - completed
                      - dropped
                    example: watching

        "401":
          description: Authentication required or invalid token

        "500":
          description: Error checking watchlist

    delete:
      tags:
        - Watchlist
      summary: Remove media from watchlist
      description: Removes a media item from the authenticated user's watchlist.

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: mediaId
          required: true
          schema:
            type: integer
          example: 42

      responses:
        "204":
          description: Media removed from watchlist successfully

        "401":
          description: Authentication required or invalid token

        "500":
          description: Error removing from watchlist

  /api/follow/{username}:
    post:
      tags:
        - Follow
      summary: Follow a user
      description: >
        Makes the authenticated user follow another user.
        Users cannot follow themselves.

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: username
          required: true
          description: Case-insensitive username of the user to follow. Self-follow checks use user IDs.
          schema:
            type: string
          example: johndoe

      responses:
        "201":
          description: User followed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  following:
                    type: boolean
                    example: true

        "400":
          description: Cannot follow yourself

        "401":
          description: Authentication required or invalid token

        "404":
          description: User not found

        "500":
          description: Internal server error

    delete:
      tags:
        - Follow
      summary: Unfollow a user
      description: Makes the authenticated user stop following another user.

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: username
          required: true
          description: Case-insensitive username of the user to unfollow.
          schema:
            type: string
          example: johndoe

      responses:
        "200":
          description: User unfollowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  following:
                    type: boolean
                    example: false

        "401":
          description: Authentication required or invalid token

        "404":
          description: User not found

        "500":
          description: Internal server error

  /api/top-five:
    put:
      tags:
        - Top Five
      summary: Update current user's Top 5
      description: >
        Replaces the authenticated user's Top 5 media list.
        Up to five entries may be supplied.
        Media IDs and ranks must be unique, and ranks must be between 1 and 5.
        Titles blocked by the server moderation policy cannot be selected.
        A replacement that would remove hidden existing entries is rejected
        so those records remain intact pending an explicit maintenance decision.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  maxItems: 5
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/TopFiveInput"

            example:
              items:
                - mediaId: 42
                  rank: 1
                - mediaId: 18
                  rank: 2
                - mediaId: 77
                  rank: 3

      responses:
        "200":
          description: Top 5 updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopFiveEntry"

        "400":
          description: >
            Invalid Top 5 data, duplicate media IDs or ranks,
            invalid rank values, or media IDs that do not exist.

        "401":
          description: Authentication required or invalid token

        "500":
          description: Error updating Top 5

        "409":
          description: Existing hidden Top 5 entries require manual review before replacement

  /api/top-five/{username}:
    get:
      tags:
        - Top Five
      summary: Get a user's Top 5
      description: Returns the public Top 5 media list for the specified username using case-insensitive lookup.

      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
          example: guilherme

      responses:
        "200":
          description: Top 5 loaded successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopFiveEntry"

        "404":
          description: User not found

        "500":
          description: Error loading Top 5
